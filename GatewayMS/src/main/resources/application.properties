# =================================
# Application
# =================================
spring.application.name=GatewayMS

# =================================
# Server
# =================================
server.port=9000


# =================================
# Gateway Default Filters
# =================================
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin RETAIN_UNIQUE


# =================================
# CORS
# =================================
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000}
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true


# =================================
# UserMS Also Rewrite path filter
# =================================
spring.cloud.gateway.routes[0].id=UserMS
spring.cloud.gateway.routes[0].uri=${USERMS_URL:lb://UserMS}
spring.cloud.gateway.routes[0].predicates[0]=Path=/user/**
spring.cloud.gateway.routes[0].filters[0]=TokenFilter
#spring.cloud.gateway.routes[0].predicates[0]=Path=/api/user/**
#spring.cloud.gateway.routes[0].filters[1]=RewritePath=/user/(?<segment>.*), /api/user/${segment}

# =================================
# ProfileMS
# =================================
spring.cloud.gateway.routes[1].id=ProfileMs
spring.cloud.gateway.routes[1].uri=${PROFILEMS_URL:lb://ProfileMs}
spring.cloud.gateway.routes[1].predicates[0]=Path=/profile/**
spring.cloud.gateway.routes[1].filters[0]=TokenFilter
#spring.cloud.gateway.routes[0].predicates[0]=Path=/api/profile/**
#spring.cloud.gateway.routes[0].filters[1]=RewritePath=/profile/(?<segment>.*), /api/profile/${segment}

# =================================
# AppointmentMS
# =================================
spring.cloud.gateway.routes[2].id=AppointmentMS
spring.cloud.gateway.routes[2].uri=${APPOINTMENTMS_URL:lb://AppointmentMS}
spring.cloud.gateway.routes[2].predicates[0]=Path=/appointment/**
spring.cloud.gateway.routes[2].filters[0]=TokenFilter
#spring.cloud.gateway.routes[0].predicates[0]=Path=/api/appointment/**
#spring.cloud.gateway.routes[0].filters[1]=RewritePath=/appointment/(?<segment>.*), /api/appointment/${segment}

# =================================
# Eureka Server
# =================================
spring.cloud.gateway.routes[3].id=eureka-server
spring.cloud.gateway.routes[3].uri=${EUREKAURL:http://localhost:8761}
spring.cloud.gateway.routes[3].predicates[0]=Path=/eureka/main
spring.cloud.gateway.routes[3].filters[0]=SetPath=/


# =================================
# Eureka Server Static
# =================================
spring.cloud.gateway.routes[4].id=eureka-server-static
spring.cloud.gateway.routes[4].uri=${EUREKAURL:http://localhost:8761}
spring.cloud.gateway.routes[4].predicates[0]=Path=/eureka/**
#spring.cloud.gateway.routes[4].filters[0]=RewritePath=/eureka/(?<segment>.*), /${segment}




# =================================
# Eureka
# =================================
eureka.client.register-with-eureka=true

eureka.client.fetch-registry=true

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}


