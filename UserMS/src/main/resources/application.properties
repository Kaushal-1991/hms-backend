spring.application.name=UserMS

server.port=8080

# Database URL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hms_userdb?allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

USER_NOT_FOUND=User not found
USER_ALREADY_EXISTS=User Already Exists
INVALID_CREDENTIAL=Invalid Credential
SECRET_KEY=SSWuHijaMXSWyVtU2NERpKPGXF0hPN2

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

profiles.url=${PROFILEMS_URL:http://localhost:8081}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

logging.file.name=../logs/${spring.application.name}.log
logging.level.com.hms.user=DEBUG
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30


